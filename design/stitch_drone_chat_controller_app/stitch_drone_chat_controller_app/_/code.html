<!DOCTYPE html><html lang="ko" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0066FF',
              dark: '#0052CC',
              light: '#EBF3FF',
              accent: '#2563EB',
            },
            surface: {
              subtle: '#F8F9FA',
              border: '#E9ECEF',
              chatBg: '#F1F5F9',
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Apple SD Gothic Neo', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 2px 10px rgba(0, 0, 0, 0.04)',
            'floating': '0 8px 24px rgba(0, 0, 0, 0.08)',
          }
        }
      }
    };
  </script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- Typography & Global CSS -->
<style data-purpose="global-styles">
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Custom scrollbar for chat log */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #E2E8F0;
      border-radius: 9999px;
    }

    /* Trajectory pulse animation */
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 0.3; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    .pulse-effect {
      animation: pulse-ring 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" data-snapdom="injected-import"></head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-4 text-slate-800 antialiased">
<!-- Mobile Frame Container (Simulating iPhone 390px viewport) -->
<div class="w-full max-w-[390px] h-screen sm:h-[844px] bg-[#FFFFFF] sm:rounded-[44px] shadow-2xl overflow-hidden flex flex-col relative border-0 sm:border-[8px] sm:border-slate-800" data-purpose="mobile-screen-wrapper">
<!-- BEGIN: iOS Status Bar Simulation -->
<div class="w-full h-11 px-7 pt-3 flex justify-between items-center bg-white z-30 select-none shrink-0" data-purpose="status-bar">
<span class="text-[14px] font-semibold tracking-tight text-slate-900">9:41</span>
<div class="flex items-center gap-1.5 text-slate-900">
<!-- Signal icon -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="signal" aria-hidden="true" class="lucide lucide-signal w-3.5 h-3.5 stroke-[2.5]"><path d="M2 20h.01"></path><path d="M7 20v-4"></path><path d="M12 20v-8"></path><path d="M17 20V8"></path><path d="M22 4v16"></path></svg>
<!-- Wifi icon -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="wifi" aria-hidden="true" class="lucide lucide-wifi w-3.5 h-3.5 stroke-[2.5]"><path d="M12 20h.01"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><path d="M5 12.859a10 10 0 0 1 14 0"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path></svg>
<!-- Battery icon -->
<div class="w-5 h-2.5 border-[1.5px] border-slate-900 rounded-[3px] p-0.5 flex items-center">
<div class="w-3/4 h-full bg-slate-900 rounded-[1px]"></div>
</div>
</div>
</div>
<!-- END: iOS Status Bar Simulation -->
<!-- BEGIN: MainHeader -->
<header class="px-5 py-2.5 flex items-center justify-between border-b border-surface-border bg-white z-20 shrink-0" data-purpose="app-header">
<!-- Title -->
<h1 class="text-2xl font-bold tracking-tight text-slate-900">Drone</h1>
<!-- Telemetry Status Badges -->
<div class="flex items-center gap-3"><!-- Connection Status (Unboxed, clean) -->
<div class="flex items-center gap-1.5 text-xs text-slate-500 font-medium">
  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
  <span class="">연결됨</span>
</div>
<span class="text-slate-300 text-xs">•</span>
<!-- Battery Status (Clean inline) -->
<div class="flex items-center gap-1 text-xs text-slate-500 font-medium">
  <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <rect height="12" rx="2" ry="2" width="18" x="2" y="6"></rect>
    <line x1="22" x2="22" y1="10" y2="14"></line>
    <rect fill="currentColor" height="8" rx="1" width="11" x="4" y="8"></rect>
  </svg>
  <span class="">84%</span>
</div></div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: SegmentedControl -->
<div class="px-5 pt-3 pb-2 bg-white shrink-0" data-purpose="view-mode-toggle">
<div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl"><!-- Tab 1: Map (Unselected) -->
<button class="flex items-center justify-center gap-1.5 py-1.5 rounded-lg text-sm font-medium transition-all text-slate-500 hover:text-slate-700" type="button">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="map" aria-hidden="true" class="lucide lucide-map w-4 h-4 text-slate-400"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"></path><path d="M15 5.764v15"></path><path d="M9 3.236v15"></path></svg>
<span class="">지도</span>
</button>
<!-- Tab 2: Camera (Selected) -->
<button class="flex items-center justify-center gap-1.5 py-1.5 rounded-lg text-sm font-semibold transition-all bg-white text-slate-900 shadow-soft" type="button">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="camera" aria-hidden="true" class="lucide lucide-camera w-4 h-4 text-brand"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"></path><circle cx="12" cy="13" r="3"></circle></svg>
<span class="">카메라</span>
</button></div>
</div>
<!-- END: SegmentedControl -->
<!-- BEGIN: DroneFlightMapArea -->
<!-- Represents the top ~40% display canvas area with real-time vector map, trajectory & safety overlays -->
<section class="relative h-[220px] bg-[#0E1626] overflow-hidden shrink-0 border-b border-slate-200" data-purpose="flight-map-display"><!-- Live FPV Camera Feed Background -->
<img alt="드론 실시간 FPV 카메라 뷰" class="w-full h-full object-cover absolute inset-0 select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtGxoWRgIqTM245FNXcGyTakOJYN3NGJEExhY-ag2cee52TPziZ3E6oUISfB3ldtFQAs8hCNGIu5z8smT0bemSgft0mEm8lvFBXGfkHxzdz2iTSyavBW2yZ7Oz0oRGZ_0ubCxoGCCNK9PGRJI1n-bakRCAJZC1FfcX57NJwR_ygZSYG1UsWAIUKvotbv0pkt38acPDl1r4Rs4jnVTU55SR2CihMJdCKwwtWEfGn3g-BtCeMLXEcKptPQ">
<!-- Camera Dark Vignette/Gradient Overlay for HUD Legibility -->
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/50 pointer-events-none"></div>
<!-- Top-Left Camera Mode HUD: RGB/Depth Toggle & LIVE indicator -->
<div class="absolute top-3 left-3 flex items-center gap-2 z-10">
<!-- RGB / Depth Toggle Pill -->
<div class="flex items-center p-0.5 bg-slate-900/80 backdrop-blur-md rounded-lg border border-slate-700/80 text-xs font-semibold shadow-md">
<button class="px-2 py-0.5 bg-brand text-white rounded-[5px] transition-all text-[11px] shadow-sm" type="button">RGB</button>
<button class="px-2 py-0.5 text-slate-300 hover:text-white transition-all text-[11px]" type="button">Depth</button>
</div>
<!-- LIVE REC Indicator -->
<div class="flex items-center gap-1 px-2 py-1 bg-slate-900/75 backdrop-blur-md rounded-md border border-slate-700/60 text-[10px] font-semibold text-white tracking-wider">
<span class="w-2 h-2 rounded-full bg-rose-600 animate-pulse"></span>
<span class="">LIVE</span>
<span class="text-slate-400 font-normal">60fps</span>
</div>
</div>
<!-- Center FPV Crosshair / Reticle Overlay -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
<div class="relative w-20 h-20 flex items-center justify-center">
<!-- Center crosshair circle & tick -->
<div class="w-10 h-10 border border-white/40 rounded-full flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-white/70"></div>
</div>
<!-- Corner reticle brackets -->
<div class="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-white/60"></div>
<div class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-white/60"></div>
<div class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-white/60"></div>
<div class="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-white/60"></div>
</div>
</div>
<!-- Emergency Flight Controls (Top-Right overlay for tap safety) -->
<div class="absolute top-3 right-3 flex items-center gap-2 z-10"><button type="button" class="bg-white/90 backdrop-blur-md border border-white/60 shadow-sm text-slate-800 text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 active:scale-95 transition-all shrink-0"><svg class="w-3.5 h-3.5 text-slate-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"></path><path d="m7 11 5 5 5-5"></path><line x1="5" y1="20" x2="19" y2="20"></line></svg><span class="">착륙</span></button><button type="button" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3.5 py-1.5 rounded-full shadow-md flex items-center gap-1.5 active:scale-95 transition-all shrink-0"><span class="w-2 h-2 rounded-[2px] bg-white"></span><span class="">정지</span></button></div>
<!-- Telemetry Info Chips (Bottom overlay of camera view) -->
<div class="absolute bottom-2.5 left-3 right-3 flex items-center justify-between pointer-events-none z-10">
<div class="flex items-center gap-1.5">
<!-- Altitude Chip -->
<div class="px-2 py-1 bg-slate-900/75 backdrop-blur-md border border-slate-700/60 rounded-md text-[11px] font-medium text-slate-200 flex items-center gap-1">
<span class="text-slate-400">고도</span>
<span class="font-bold text-white">2.0m</span>
</div>
<!-- Speed / Heading Chip -->
<div class="px-2 py-1 bg-slate-900/75 backdrop-blur-md border border-slate-700/60 rounded-md text-[11px] font-medium text-slate-200 flex items-center gap-1">
<span class="text-slate-400">속도</span>
<span class="font-bold text-white">0.8m/s</span>
</div>
<div class="px-2 py-1 bg-slate-900/75 backdrop-blur-md border border-slate-700/60 rounded-md text-[11px] font-medium text-slate-200 flex items-center gap-1"><span class="text-slate-400">상태</span><span class="font-bold text-white">공중</span></div></div>
<!-- Mode Indicator -->

</div></section>
<!-- END: DroneFlightMapArea -->
<!-- BEGIN: ChatArea -->
<!-- Natural Language Conversation Interface according to sketch bubbles -->
<main class="flex-1 overflow-y-auto px-4 py-3 space-y-3 bg-[#F8FAFC]" data-purpose="chat-messages-container">
<!-- Timestamp Divider -->
<div class="flex justify-center my-1">
<span class="text-[10px] font-medium text-slate-400 bg-white border border-slate-200/80 px-2 py-0.5 rounded-full shadow-2xs">
          오늘 오후 2:20
        </span>
</div>
<!-- User Bubble 1 -->
<div class="flex flex-col items-end gap-1">
<div class="flex items-end gap-1.5 max-w-[80%]">
<span class="text-[10px] text-slate-400 mb-0.5">14:20</span>
<div class="px-3.5 py-2 bg-brand text-white rounded-2xl rounded-br-xs text-[13px] leading-relaxed shadow-soft font-normal">
            앞으로 가
          </div>
</div>
</div>
<!-- Assistant Response 1 -->
<div class="flex flex-col items-start gap-1">
<div class="flex items-start gap-2 max-w-[85%]">
<!-- Mini Drone AI Avatar -->
<div class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center shrink-0 mt-0.5 text-brand">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="bot" aria-hidden="true" class="lucide lucide-bot w-3.5 h-3.5"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
</div>
<div class="flex flex-col gap-1.5">
<div class="px-3.5 py-2 bg-white text-slate-800 rounded-2xl rounded-tl-xs text-[13px] leading-relaxed shadow-soft border border-slate-200/60">
              앞으로 얼마나 갈까요?
            </div>
<!-- Quick Reply Distance Chips (Interactive suggestion pills) -->
<div class="flex items-center gap-1.5 mt-0.5 flex-wrap">
<button class="px-2.5 py-1 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-full font-medium shadow-2xs active:scale-95 transition-transform" type="button">
                1m
              </button>
<button class="px-2.5 py-1 bg-brand-light border border-brand text-brand text-xs rounded-full font-semibold shadow-2xs active:scale-95 transition-transform" type="button">
                3m
              </button>
<button class="px-2.5 py-1 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-full font-medium shadow-2xs active:scale-95 transition-transform" type="button">
                5m
              </button>
<button class="px-2 py-1 bg-white hover:bg-slate-50 border border-dashed border-slate-300 text-slate-500 text-xs rounded-full" type="button">
                직접 입력
              </button>
</div>
</div>
</div>
</div>
<!-- User Bubble 2 -->
<div class="flex flex-col items-end gap-1">
<div class="flex items-end gap-1.5 max-w-[80%]">
<span class="text-[10px] text-slate-400 mb-0.5">14:21</span>
<div class="px-3.5 py-2 bg-brand text-white rounded-2xl rounded-br-xs text-[13px] leading-relaxed shadow-soft">
            3m
          </div>
</div>
</div>
<!-- Assistant Status Bubble (Live in-flight progress) -->
<div class="flex items-start gap-2 max-w-[88%]">
<div class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center shrink-0 mt-0.5 text-brand">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="bot" aria-hidden="true" class="lucide lucide-bot w-3.5 h-3.5"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
</div>
<div class="w-full px-3.5 py-2.5 bg-white text-slate-800 rounded-2xl rounded-tl-xs text-[13px] shadow-soft border border-slate-200/60">
<div class="flex items-center justify-between mb-1.5">
<span class="font-medium text-slate-800">전방 3m 이동 중...</span>
<span class="text-[11px] font-bold text-brand">65%</span>
</div>
<!-- Progress bar -->
<div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
<div class="bg-brand h-full rounded-full transition-all duration-300" style="width: 65%"></div>
</div>
</div>
</div>
</main>
<!-- END: ChatArea -->
<!-- BEGIN: ChatInputBar -->
<!-- Matches capsule input with voice & send trigger from sketch -->
<div class="p-3 bg-white border-t border-slate-100 shrink-0" data-purpose="chat-input-container">
<form class="flex items-center gap-2" onsubmit="event.preventDefault()">
<!-- Voice Input Button (Mic) -->
<button aria-label="음성 명령" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center shrink-0 transition-colors" type="button">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="mic" aria-hidden="true" class="lucide lucide-mic w-4 h-4"><path d="M12 19v3"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><rect x="9" y="2" width="6" height="13" rx="3"></rect></svg>
</button>
<!-- Rounded Capsule Text Input -->
<div class="flex-1 relative flex items-center">
<input class="w-full bg-slate-50 border border-slate-200 focus:border-brand focus:ring-1 focus:ring-brand rounded-full py-2 pl-4 pr-3 text-[13px] placeholder:text-slate-400 outline-none transition-all" placeholder="명령을 입력하세요 (예: 앞으로 3m 가)" type="text">
</div>
<!-- Blue Circular Send Button (Paper plane from sketch) -->
<button aria-label="전송" class="w-9 h-9 rounded-full bg-brand hover:bg-brand-dark active:scale-95 text-white flex items-center justify-center shrink-0 shadow-md transition-transform" type="submit">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="navigation" aria-hidden="true" class="lucide lucide-navigation w-4 h-4 fill-current rotate-90 translate-x-[1px]"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
</button>
</form>
</div>
<!-- END: ChatInputBar -->
<!-- BEGIN: BottomNavigation -->
<!-- 2 Tabs matching sketch bottom: Left [Drone Icon: 조종], Right [QA: Q&A] -->
<nav class="grid grid-cols-2 bg-white border-t border-slate-200 py-1.5 pb-5 px-6 shrink-0" data-purpose="bottom-navigation-bar">
<!-- Tab 1: 조종 (Drone Control) - Active -->
<button class="flex flex-col items-center justify-center gap-0.5 text-brand group" type="button">
<div class="w-6 h-6 flex items-center justify-center">
<!-- Quadcopter Drone Icon -->
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
<circle cx="5" cy="5" fill="none" r="2.2" stroke="currentColor" stroke-width="1.8"></circle>
<circle cx="19" cy="5" fill="none" r="2.2" stroke="currentColor" stroke-width="1.8"></circle>
<circle cx="5" cy="19" fill="none" r="2.2" stroke="currentColor" stroke-width="1.8"></circle>
<circle cx="19" cy="19" fill="none" r="2.2" stroke="currentColor" stroke-width="1.8"></circle>
<path d="M6.5 6.5L17.5 17.5M17.5 6.5L6.5 17.5" stroke="currentColor" stroke-width="2"></path>
<circle cx="12" cy="12" fill="currentColor" r="2.8"></circle>
</svg>
</div>
<span class="text-[11px] font-bold tracking-tight">조종</span>
</button>
<!-- Tab 2: Q&A - Inactive -->
<button class="flex flex-col items-center justify-center gap-0.5 text-slate-400 hover:text-slate-600 group" type="button">
<div class="w-6 h-6 flex items-center justify-center">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="help-circle" aria-hidden="true" class="lucide lucide-help-circle w-5 h-5 stroke-[2]"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
</div>
<span class="text-[11px] font-medium tracking-tight">Q&amp;A</span>
</button>
</nav>
<!-- END: BottomNavigation -->
<!-- iOS Home Indicator -->
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-900/40 rounded-full pointer-events-none" data-purpose="ios-home-bar"></div>
</div>
<!-- Lucide Icon Initializer -->
<script data-purpose="icon-initialization">
    lucide.createIcons();
  </script>




</body></html>
